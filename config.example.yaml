# Настройки TwitchCut. Здесь только главное; полный список с пояснениями — в twitchcut/config.py

language: ru            # язык стрима: ru / en / auto

analysis:
  # deep — распознаётся весь стрим, Claude читает его целиком и находит истории, новости, мнения,
  #        даже если чат молчал (рекомендуется; дольше: ~10–25 мин распознавания на час стрима на процессоре)
  # fast — только моменты, где оживился чат или стример стал громче (быстро, но «тихие» темы пропускаются)
  mode: deep

scan:
  chunk_minutes: 25     # сколько минут расшифровки Claude читает за один запрос
  model: ""             # модель для чтения всего стрима: пусто = как cli_model; haiku — бережёт лимиты

clips:
  max_clips: 8          # сколько клипов монтировать
  max_duration: 300     # жёсткий предел, с (5 мин); реальную длину выбирает Claude по смыслу момента
  min_score: 55         # отсекать моменты с оценкой ниже (0..100)

llm:
  # claude-cli — Claude Code на этом ПК: работает по вашей подписке Pro/Max, без оплаты за токены
  # api        — Anthropic API: платно за токены, нужен ключ
  # manual     — промпт копируется в обычный чат Claude вручную
  # none       — без Claude: только сигналы чата и звука
  backend: claude-cli
  cli_model: sonnet     # haiku — быстрее и экономнее лимиты, sonnet — баланс (рекомендуется), opus — максимум
  api_key: ""           # только для backend: api
  model: claude-sonnet-5-5
  batch_size: 12        # кандидатов в одном запросе: больше — меньше запросов к лимитам

censor:
  enabled: true
  # partial — начало слова слышно, остальное глухо (понятно, что сказано, но запикано; без провалов тишины)
  # muffle  — всё слово глухо;  mute — тишина;  beep — тон поверх
  mode: partial
  muffle_freq: 320      # насколько глухо, Гц: меньше — глуше
  pad_ms: 40            # запас вокруг слова, мс
  subtitles: true       # в субтитрах мат маскируется: Б**ТЬ

render:
  layout: auto          # auto / split (вебка+игра) / cam (только вебка) / crop (кадр по лицу) / blur (кадр на размытом фоне)
  dynamic_layout: true  # в auto: пока на экране что-то идёт — «вебка + экран»; экран стоит, а стример рассказывает — только вебка
  cam_height: 820       # запасная высота вебки сверху; обычно подгоняется под пропорции вебки, чтобы она вошла целиком
  cam_rect: null        # если авто не находит вебку: [x, y, ширина, высота] в долях кадра, напр. [0.75, 0.70, 0.25, 0.30]
  font: Arial Black
  font_size: 74
  highlight_color: "#FFE135"
  trim_pauses: true     # вырезать «мёртвые» паузы в речи (не трогает смех, реакции и звук игры)
  speed: 1.0            # ускорение по умолчанию; у каждого клипа можно выбрать 1.1×–2×
  hook_title: false     # надпись на видео не ставим — варианты названий только предлагаются
  encoder: auto         # auto: видеокарта (AMD h264_amf / NVIDIA h264_nvenc / Intel h264_qsv), если есть, иначе процессор

whisper:
  # auto — видеокарта (whisper.cpp, если установлен setup_gpu.bat) и процессор работают вместе
  # whispercpp — только видеокарта;  faster-whisper — только процессор (как раньше)
  backend: auto
  hybrid: true          # видеокарта и процессор распознают разные куски стрима одновременно
  model: auto           # модель для процессора. auto: small. medium — точнее, но в 2–3 раза медленнее
  device: auto

live:
  # Прямой эфир разбирается кусками по часу: так Claude видит контекст и моменты не режутся на стыках.
  # Клипы за час появляются примерно через 5–15 минут после конца этого часа.
  # Хотите клипы быстрее — поставьте 15 и 15 (кусками по 15 минут)
  min_chunk_minutes: 60
  max_chunk_minutes: 60
  backfill_minutes: 0    # подключились посреди эфира: 0 — разобрать весь эфир с самого начала
  max_per_cycle: 6       # не больше клипов за один час
  context_minutes: 5     # сколько минут до нового куска Claude перечитывает, чтобы понимать контекст
  min_score: 60          # в эфире монтируются только моменты с оценкой от 60

cleanup:
  keep_days: 2          # через сколько дней удалять видео старых задач (статистика и названия остаются)

twitch:
  # Необязательно. Даёт клипы, которые нарезали зрители (сильный сигнал). dev.twitch.tv/console/apps
  client_id: ""
  client_secret: ""
